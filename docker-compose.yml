# Local stack: the app plus a PostgreSQL instance.
#
#   docker compose up --build      → http://localhost:5000
#
# In production you would normally point DATABASE_URL at a managed database
# and run only the `app` service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rice_inventory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rice_inventory']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rice_inventory
      # Override this. The server refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEBUG_LOG_PATH: /app/debug-130b99.log
    volumes:
      - ./debug-130b99.log:/app/debug-130b99.log
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
