# Local stack: the app plus a PostgreSQL instance.
#
#   docker compose up --build      → http://localhost:5000
#
# In production you would normally point DATABASE_URL at a managed database
# and run only the `app` service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rice_inventory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rice_inventory']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rice_inventory
      # Override this. The server refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The day a "day" ends for daily report buckets. Timestamps are stored as
      # TIMESTAMPTZ and the container clock is UTC, so without this a sale at
      # 02:00 in Karachi is filed under the previous day.
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Karachi}
    depends_on:
      postgres:
        condition: service_healthy

  # TLS terminator. Optional: bring it up with `--profile tls`, so a plain
  # `docker compose up -d` on a machine with no domain still works unchanged.
  #
  #   docker compose --profile tls up -d
  #
  # Port 5000 stays published on `app` above, so the direct HTTP route keeps
  # working while the certificate is being issued and as a fallback.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['tls']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - app

volumes:
  postgres-data:
  # Holds the issued certificates. Let's Encrypt rate-limits to 5 per hostname
  # per week, so losing this volume is not free.
  caddy-data:
  caddy-config:
  caddy-logs:
