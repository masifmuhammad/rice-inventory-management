# One HTTPS origin for React and Express on Render's free plan.
#
# The database lives outside Render (Neon's free tier): Render's free
# PostgreSQL is deleted 30 days after creation, which would lose business data.
# Free web services sleep after 15 minutes idle; the first request after that
# takes about a minute while the container wakes.
services:
  - type: web
    name: rice-inventory
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the Neon connection string (it includes ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TZ
        value: Asia/Karachi
      - key: REPORT_TIMEZONE
        value: Asia/Karachi
      # Optional: leave blank to hide the AI assistant.
      - key: OPENROUTER_API_KEY
        sync: false
