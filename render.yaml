# One HTTPS origin for React and Express, plus private managed PostgreSQL.
# Paid plans keep production available without free-tier idle spin-down.
services:
  - type: web
    name: rice-inventory
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rice-inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TZ
        value: Asia/Karachi
      - key: REPORT_TIMEZONE
        value: Asia/Karachi
      # Optional: leave blank to hide the AI assistant.
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: rice-inventory-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: rice_inventory
    user: rice_inventory
    postgresMajorVersion: "16"
    diskSizeGB: 5
    ipAllowList: []
