# Manual backend check. Oracle is the primary host; Render is retained only
# for recovery. Scheduled pings must not keep Render or Neon compute awake.
name: Check backend health

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 30 --retry 2 https://193.123.81.103.nip.io/api/health
